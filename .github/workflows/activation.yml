name: Acquire Unity activation file

# Run once manually (Actions tab -> Run workflow) to get the .alf file for Unity Personal license activation.
on:
  workflow_dispatch:

jobs:
  activation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: request
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.0.58f2
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.request.outputs.filePath }}
          path: ${{ steps.request.outputs.filePath }}
