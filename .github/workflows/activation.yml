name: Acquire Unity activation file

# Creates the .alf file for manual Unity Personal activation (https://license.unity3d.com/manual).
on:
  workflow_dispatch:
  push:
    branches: [ "claude/**" ]
    paths: [ ".github/workflows/activation.yml" ]

jobs:
  activation:
    runs-on: ubuntu-latest
    steps:
      - name: Create activation request file
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm -v "$PWD/out:/out" unityci/editor:ubuntu-6000.0.58f2-linux-il2cpp-3 bash -c \
            "cd /tmp && unity-editor -batchmode -nographics -logFile - -quit -createManualActivationFile; ls -la /tmp; cp /tmp/*.alf /out/ || true"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: unity-activation-alf
          path: out/*.alf
          if-no-files-found: error
