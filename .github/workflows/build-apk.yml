name: Build APK + Screenshots

# Needs repo secrets UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD (see docs/SDK_SETUP.md). Run manually or on push to claude/**.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  UNITY_VERSION: 6000.0.58f2

jobs:
  screenshots:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-shots-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-shots-
      - name: Resolve packages
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildMethod: MergeLegion.Editor.CiSetup.ResolvePackages
          allowDirtyBuild: true
      - name: Install TMP essential resources
        run: |
          pkg=$(sudo find Library/PackageCache -name "TMP Essential Resources.unitypackage" | head -1)
          echo "package: $pkg"
          sudo python3 tools/extract_unitypackage.py "$pkg" .
          sudo chown -R "$(id -u):$(id -g)" Assets || true
      - name: Generate scenes
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildMethod: MergeLegion.Editor.CiSetup.GenerateScenesOnly
          allowDirtyBuild: true
      - name: Build Linux player
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildMethod: MergeLegion.Editor.BuildScripts.BuildLinuxPlayer
          allowDirtyBuild: true
          versioning: None
      - name: Run player windowed under xvfb with a window manager
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb libgl1-mesa-dri libglu1-mesa openbox imagemagick x11-utils
          sudo chown -R "$(id -u):$(id -g)" Builds || true
          chmod +x Builds/linux/MergeLegion.x86_64
          mkdir -p shots_f
          cat > /tmp/runwm.sh <<'SH'
          #!/bin/bash
          # $1 = out dir, $2 = log name, rest = extra player args
          out="$1"; log="$2"; shift 2
          openbox >/tmp/openbox.log 2>&1 &
          sleep 2
          Builds/linux/MergeLegion.x86_64 -screen-width 540 -screen-height 960 -screen-fullscreen 0 "$@" \
            -logFile "$PWD/$log" -mlshots "$PWD/$out" &
          pid=$!
          for i in 1 2 3 4 5 6; do
            sleep 15
            import -window root "$PWD/$out/xroot_$i.png" 2>/dev/null || true
            grep -E "heartbeat" "$PWD/$log" | tail -1 || true
          done
          kill $pid 2>/dev/null || true
          SH
          chmod +x /tmp/runwm.sh
          echo "=== variant f: windowed GL + openbox"
          timeout 150 env vblank_mode=0 xvfb-run -a -s "-screen 0 540x960x24" /tmp/runwm.sh shots_f player_f.log -force-glcore || true
          ls shots_f | head -30
          ls shots_f | head -30
      - name: Publish screenshots to branch ci-screenshots
        if: always()
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          rm -rf /tmp/shotsrepo && mkdir -p /tmp/shotsrepo/docs/screenshots
          for d in shots_f; do for f in $d/*.png; do [ -f "$f" ] && cp "$f" "/tmp/shotsrepo/docs/screenshots/${d}_$(basename $f)"; done; done
          cp player_f.log /tmp/shotsrepo/docs/screenshots/ 2>/dev/null || true
          git checkout --orphan ci-screenshots
          git rm -rf --quiet . || true
          mkdir -p docs && cp -r /tmp/shotsrepo/docs/screenshots docs/
          git add docs/screenshots
          git commit -q -m "CI screenshots [skip ci]" || true
          git push -f origin ci-screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            shots_f
            player_f.log
          if-no-files-found: warn

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-apk-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-apk-
      - name: Resolve packages
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: MergeLegion.Editor.CiSetup.ResolvePackages
          allowDirtyBuild: true
      - name: Install TMP essential resources
        run: |
          pkg=$(sudo find Library/PackageCache -name "TMP Essential Resources.unitypackage" | head -1)
          echo "package: $pkg"
          sudo python3 tools/extract_unitypackage.py "$pkg" .
          sudo chown -R "$(id -u):$(id -g)" Assets || true
      - name: Prepare project (input handler needs an editor restart before building)
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: MergeLegion.Editor.CiSetup.GenerateScenesOnly
          allowDirtyBuild: true
      - uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: MergeLegion.Editor.BuildScripts.BuildAndroidApk
          allowDirtyBuild: true
          versioning: None
      - uses: actions/upload-artifact@v4
        with:
          name: MergeLegion-debug-apk
          path: Builds/*.apk
      - name: Publish as pre-release (easy phone download)
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug Builds/MergeLegion.apk --prerelease --target "$GITHUB_SHA" \
            --title "Debug APK ($GITHUB_SHA)" --notes "Debug-signed build for testing. Mock SDKs; no ads/IAP keys."
