name: Build APK + Screenshots

# Needs repo secrets UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD (see docs/SDK_SETUP.md). Run manually or on push to claude/**.
on:
  workflow_dispatch:
  push:
    branches: [ "claude/**" ]

permissions:
  contents: write

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  UNITY_VERSION: 6000.0.58f2

jobs:
  screenshots:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-shots-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-shots-
      - name: Resolve packages
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildMethod: MergeLegion.Editor.CiSetup.ResolvePackages
          allowDirtyBuild: true
      - name: Install TMP essential resources
        run: |
          pkg=$(sudo find Library/PackageCache -name "TMP Essential Resources.unitypackage" | head -1)
          echo "package: $pkg"
          sudo python3 tools/extract_unitypackage.py "$pkg" .
          sudo chown -R "$(id -u):$(id -g)" Assets || true
      - name: Generate scenes
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildMethod: MergeLegion.Editor.CiSetup.GenerateScenesOnly
          allowDirtyBuild: true
      - name: Build Linux player
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildMethod: MergeLegion.Editor.BuildScripts.BuildLinuxPlayer
          allowDirtyBuild: true
          versioning: None
      - name: Run player under xvfb and capture screenshots
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb libgl1-mesa-dri libglu1-mesa
          sudo chown -R "$(id -u):$(id -g)" Builds || true
          chmod +x Builds/linux/MergeLegion.x86_64
          mkdir -p Screenshots
          timeout 240 xvfb-run -a -s "-screen 0 1080x1920x24" Builds/linux/MergeLegion.x86_64 \
            -screen-width 1080 -screen-height 1920 -screen-fullscreen 0 -force-glcore \
            -logFile "$PWD/player.log" -mlshots "$PWD/Screenshots" || true
          ls -la Screenshots || true
          grep -nE "Exception|NullReference|Error" player.log | head -60 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            Screenshots
            player.log
          if-no-files-found: warn

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-apk-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-apk-
      - name: Resolve packages
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: MergeLegion.Editor.CiSetup.ResolvePackages
          allowDirtyBuild: true
      - name: Install TMP essential resources
        run: |
          pkg=$(sudo find Library/PackageCache -name "TMP Essential Resources.unitypackage" | head -1)
          echo "package: $pkg"
          sudo python3 tools/extract_unitypackage.py "$pkg" .
          sudo chown -R "$(id -u):$(id -g)" Assets || true
      - name: Prepare project (input handler needs an editor restart before building)
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: MergeLegion.Editor.CiSetup.GenerateScenesOnly
          allowDirtyBuild: true
      - uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: MergeLegion.Editor.BuildScripts.BuildAndroidApk
          allowDirtyBuild: true
          versioning: None
      - uses: actions/upload-artifact@v4
        with:
          name: MergeLegion-debug-apk
          path: Builds/*.apk
      - name: Publish as pre-release (easy phone download)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug Builds/MergeLegion.apk --prerelease --target "$GITHUB_SHA" \
            --title "Debug APK ($GITHUB_SHA)" --notes "Debug-signed build for testing. Mock SDKs; no ads/IAP keys."
